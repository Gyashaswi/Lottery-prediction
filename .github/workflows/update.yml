name: Update Lottery Data (API only)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 7 * * *"   # 07:15 UTC daily (~02:15 ET)

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: lottery-update
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          make fetch
          make clean
          python -m src.ingest.load_to_db
          python -m src.ingest.load_to_star
          python -m src.ingest.dq_checks
          python -m src.ingest.build_indices
